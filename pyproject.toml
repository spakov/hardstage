[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hardstage"
version = "0.1.0"
description = "Mirror selected files from your home directory into a hard-link staging directory, ready for backup"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
hardstage = "hardstage:main"

[tool.setuptools]
py-modules = ["hardstage"]
